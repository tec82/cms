{% extends 'base.html' %} {% block content %}

<h2>Cursos</h2>

{% for course in courses %}
<div class="card p-3 mb-3">
  <h4>{{ course.title }}</h4>
  <p>R$ {{ course.price }}</p>

  <a href="/course/{{ course.id }}" class="btn btn-primary btn-sm">Ver Curso</a>
</div>
{% endfor %} {% endblock %}
