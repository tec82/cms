{% extends 'base.html' %} {% block content %}

<!-- jQuery + Summernote -->
<link
  href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css"
  rel="stylesheet"
/>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-0">Criar Novo Post</h2>
          <p class="text-muted">
            Compartilhe seu conhecimento com a comunidade
          </p>
        </div>
        <a
          href="{{ url_for('admin.dashboard') }}"
          class="btn btn-outline-secondary btn-sm"
        >
          Cancelar
        </a>
      </div>

      <form method="POST" id="post-form" enctype="multipart/form-data">
        <div class="featured-card p-4 p-md-5">
          <!-- Título -->
          <div class="mb-4">
            <label
              class="form-label fw-bold small text-uppercase tracking-wider"
            >
              Título do Artigo
            </label>
            <input
              name="title"
              class="form-control form-control-lg border-0 ps-0 shadow-none"
              placeholder="Digite um título impactante..."
              style="
                font-size: 2.5rem;
                font-weight: 800;
                border-bottom: 2px solid #f1f5f9;
                border-radius: 0;
              "
              required
            />
          </div>

          <!-- Premium -->
          <div
            class="d-flex align-items-center gap-4 mb-4 py-3 border-bottom border-top"
          >
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                name="paid"
                id="paidSwitch"
              />
              <label class="form-check-label fw-medium" for="paidSwitch">
                Conteúdo Premium
              </label>
            </div>
          </div>

          <!-- Categoria -->
          <div class="mb-4">
            <label
              class="form-label fw-bold small text-uppercase tracking-wider text-muted"
            >
              Categoria
            </label>

            <div id="category-select-container">
              <div class="input-group">
                <select
                  name="category_id"
                  class="form-select"
                  id="category-select"
                >
                  <option value="" disabled selected>
                    Selecione uma categoria...
                  </option>
                  {% for category in categories %}
                  <option value="{{ category.id }}">{{ category.name }}</option>
                  {% endfor %}
                </select>

                <button
                  type="button"
                  class="btn btn-outline-primary btn-toggle-cat"
                  data-mode="new"
                >
                  + Nova
                </button>
              </div>
            </div>

            <div id="category-input-container" style="display: none">
              <div class="row g-2">
                <div class="col-md-5">
                  <input
                    type="text"
                    name="new_category"
                    id="new-category-input"
                    class="form-control"
                    placeholder="Nome da categoria..."
                  />
                </div>
                <div class="col-md-5">
                  <input
                    type="text"
                    name="new_category_description"
                    id="new-category-description"
                    class="form-control"
                    placeholder="Descrição curta (opcional)..."
                  />
                </div>                
                <div class="col-md-2">
                  <button
                    type="button"
                    class="btn btn-outline-secondary w-100 btn-toggle-cat"
                    data-mode="select"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Summernote -->
          <div class="mb-4">
            <label
              class="form-label fw-bold small text-uppercase tracking-wider text-muted"
            >
              Conteúdo
            </label>
            <textarea id="summernote" name="content"></textarea>
          </div>
          <div class="col-md-5">
            <input type="file" name="image"  class="form-control">
          </div>
          <!-- Submit -->
          <div class="border-top pt-4 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">
              Publicar Post →
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    // Alternar categoria
    $(".btn-toggle-cat").on("click", function () {
      const mode = $(this).data("mode");

      if (mode === "new") {
        $("#category-select-container").hide();
        $("#category-input-container").show();
        $("#category-select").prop("required", false);
        $("#new-category-input").prop("required", true).focus();
      } else {
        $("#category-input-container").hide();
        $("#category-select-container").show();
        $("#new-category-input").val("").prop("required", false);
        $("#new-category-description").val("");
        $("#category-select").prop("required", true);
      }
    });

    // Inicializa Summernote
    $("#summernote").summernote({
      placeholder: "Comece a escrever sua história...",
      height: 300,
      toolbar: [
        ["style", ["style"]],
        ["font", ["bold", "italic", "underline"]],
        ["para", ["ul", "ol", "paragraph"]],
        ["insert", ["link", "picture"]],
        ["view", ["codeview"]],
      ],
    });
  });
</script>

<style>
  .tracking-wider {
    letter-spacing: 0.05em;
  }
</style>

{% endblock %}
