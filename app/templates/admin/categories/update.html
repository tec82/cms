{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold mb-0">
                        Editar Categoria
                    </h2>

                    <p class="text-muted">
                        Atualize as informações da categoria
                    </p>

                </div>

                <a
                    href="{{ url_for('admin.categories') }}"
                    class="btn btn-outline-secondary btn-sm"
                >
                    Cancelar
                </a>

            </div>

            <!-- FORM -->
            <form method="POST">

                <div class="card border-0 shadow-sm p-4">

                    <!-- NOME -->
                    <div class="mb-4">

                        <label
                            class="form-label fw-bold small text-uppercase text-muted"
                        >
                            Nome da Categoria
                        </label>

                        <input
                            type="text"
                            name="name"
                            value="{{ category.name }}"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- DESCRIÇÃO -->
                    <div class="mb-4">

                        <label
                            class="form-label fw-bold small text-uppercase text-muted"
                        >
                            Descrição
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                        >{{ category.description }}</textarea>

                    </div>
                    <!-- CONFIGURAÇÕES -->
                    <div
                        class="d-flex align-items-center gap-4 mb-4 py-3 border-top border-bottom"
                    >

                        <!-- PREMIUM -->
                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_paid"
                                id="paidSwitch"
                                {% if category.is_paid %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label fw-medium"
                                for="paidSwitch"
                            >
                                Categoria Premium
                            </label>

                        </div>

                        <!-- DESTAQUE -->
                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_detach"
                                id="detachSwitch"
                                {% if category.is_detach %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label fw-medium"
                                for="detachSwitch"
                            >
                                Categoria Destaque
                            </label>

                        </div>

                    </div>

                    <!-- BOTÃO -->
                    <div class="border-top pt-4 d-flex justify-content-end">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg px-5 fw-bold"
                        >
                            Atualizar Categoria
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
