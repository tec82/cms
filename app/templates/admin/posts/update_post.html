{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-9">

      <!-- HEADER -->
      <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
          <h2 class="fw-bold mb-0">Editar Post</h2>
          <p class="text-muted">
            Atualize as informações do seu artigo
          </p>
        </div>

        <a
          href="{{ url_for('admin.dashboard') }}"
          class="btn btn-outline-secondary btn-sm"
        >
          Cancelar
        </a>

      </div>

      <!-- FORM -->
      <form
        method="POST"
        enctype="multipart/form-data"
      >

        <div class="featured-card p-4 p-md-5 border rounded bg-white shadow-sm">

          <!-- TÍTULO -->
          <div class="mb-4">

            <label
              class="form-label fw-bold small text-uppercase text-muted"
            >
              Título do Artigo
            </label>

            <input
              type="text"
              name="title"
              value="{{ post.title }}"
              class="form-control form-control-lg border-0 ps-0 shadow-none"
              placeholder="Digite o título..."
              style="
                font-size: 2.2rem;
                font-weight: 800;
                border-bottom: 2px solid #f1f5f9;
                border-radius: 0;
              "
              required
            >

          </div>

          <!-- CATEGORIA -->
          <div class="mb-4">

            <label
              class="form-label fw-bold small text-uppercase text-muted"
            >
              Categoria
            </label>

            <select
              name="category_id"
              class="form-select"
              required
            >

              <option value="">
                Selecione uma categoria...
              </option>

              {% for category in categories %}

                <option
                  value="{{ category.id }}"
                  {% if post.category_id == category.id %}
                    selected
                  {% endif %}
                >
                  {{ category.name }}
                </option>

              {% endfor %}

            </select>

          </div>

          <!-- IMAGEM -->
          <div class="mb-4">

            <label
              class="form-label fw-bold small text-uppercase text-muted"
            >
              Imagem de Capa
            </label>

            {% if post.image_url %}

              <div class="mb-3">

                <img
                  src="{{ post.image_url }}"
                  class="img-fluid rounded border"
                  style="max-height: 250px; object-fit: cover;"
                >

              </div>

            {% endif %}

            <input
              type="file"
              name="image"
              class="form-control"
            >

          </div>

          <!-- PREMIUM -->
          <div
            class="d-flex align-items-center gap-4 mb-4 py-3 border-bottom border-top"
          >

            <div class="form-check form-switch">

              <input
                class="form-check-input"
                type="checkbox"
                name="paid"
                id="paidSwitch"
                {% if post.is_paid %}
                  checked
                {% endif %}
              >

              <label
                class="form-check-label fw-medium"
                for="paidSwitch"
              >
                Conteúdo Premium
              </label>

            </div>

          </div>

          <!-- DESTAQUE -->
          <div
            class="d-flex align-items-center gap-4 mb-4 py-3 border-bottom border-top"
          >

            <div class="form-check form-switch">

              <input
                class="form-check-input"
                type="checkbox"
                name="is_detach"
                id="detachSwitch"
                {% if post.is_detach %}
                  checked
                {% endif %}
              >

              <label
                class="form-check-label fw-medium"
                for="detachSwitch"
              >
                Conteúdo Destaque
              </label>

            </div>

          </div>

          <!-- CONTEÚDO -->
          <div class="mb-4">

            <label
              class="form-label fw-bold small text-uppercase text-muted"
            >
              Conteúdo
            </label>

            <textarea
              id="summernote"
              name="content"
            >{{ post.content | safe }}</textarea>

          </div>

          <!-- BOTÃO -->
          <div class="border-top pt-4 d-flex justify-content-end">

            <button
              type="submit"
              class="btn btn-success btn-lg px-5 fw-bold"
            >
              Salvar Alterações
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>
{% endblock %}
