{% extends 'base.html' %} {% block content %}

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Summernote -->
<link
  href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-0">Editar Post</h2>
          <p class="text-muted">Atualize as informações do seu artigo</p>
        </div>
        <a
          href="{{ url_for('admin.dashboard') }}"
          class="btn btn-outline-secondary btn-sm"
        >
          Cancelar
        </a>
      </div>

      <form method="POST" id="post-form" enctype="multipart/form-data">
        <div class="featured-card p-4 p-md-5 border rounded bg-white shadow-sm">
          <!-- TÍTULO -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-muted">
              Título do Artigo
            </label>

            <input
              name="title"
              value="{{ post.title }}"
              class="form-control form-control-lg border-0 ps-0 shadow-none"
              placeholder="Digite o título..."
              style="
                font-size: 2.2rem;
                font-weight: 800;
                border-bottom: 2px solid #f1f5f9;
                border-radius: 0;
              "
              required
            />
          </div>

          <!-- PREMIUM -->
          <div
            class="d-flex align-items-center gap-4 mb-4 py-3 border-bottom border-top"
          >
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                name="paid"
                id="paidSwitch"
                {%
                if
                post.is_paid
                %}checked{%
                endif
                %}
              />
              <label class="form-check-label fw-medium" for="paidSwitch">
                Conteúdo Premium
              </label>
            </div>
          </div>

          <!-- CATEGORIA -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-muted">
              Categoria
            </label>

            <!-- SELECT -->
            <div id="category-select-container">
              <select
                name="category_id"
                class="form-select"
                id="category-select"
              >
                <option value="" disabled>Selecione uma categoria...</option>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if  post.category_id  and post.category_id==category.id %}selected{%endif
                  %}
                >
                  {{ category.name }}
                </option>
                {% endfor %}
              </select>

              <button
                type="button"
                class="btn btn-outline-primary btn-toggle-cat mt-2"
                data-mode="new"
              >
                + Nova Categoria
              </button>
            </div>

            <!-- NOVA CATEGORIA -->
            <div
              id="category-input-container"
              style="display: none"
              class="mt-3"
            >
              <div class="row g-2">
                <div class="col-md-5">
                  <input
                    type="text"
                    name="new_category"
                    id="new-category-input"
                    class="form-control"
                    placeholder="Nome da categoria..."
                  />
                </div>

                <div class="col-md-5">
                  <input
                    type="text"
                    name="new_category_description"
                    class="form-control"
                    placeholder="Descrição (opcional)..."
                  />
                </div>                
                <div class="col-md-2">
                  <button
                    type="button"
                    class="btn btn-outline-secondary w-100 btn-toggle-cat"
                    data-mode="select"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- CONTEÚDO -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-uppercase text-muted">
              Conteúdo
            </label>

            <textarea id="summernote" name="content">
              {{ post.content | safe }}
            </textarea>
          </div>
          <div class="col-md-5">
            <input type="file" name="image"  class="form-control">
          </div>
          <!-- BOTÃO -->
          <div class="border-top pt-4 d-flex justify-content-end">
            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold">
              Salvar Alterações
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    // Toggle categoria
    $(".btn-toggle-cat").on("click", function () {
      const mode = $(this).data("mode");

      if (mode === "new") {
        $("#category-select-container").hide();
        $("#category-input-container").show();

        $("#new-category-input").prop("required", true).focus();
        $("#category-select").prop("required", false);
      } else {
        $("#category-input-container").hide();
        $("#category-select-container").show();

        $("#new-category-input").val("").prop("required", false);
        $("#category-select").prop("required", true);
      }
    });

    // Summernote init
    $("#summernote").summernote({
      placeholder: "Continue escrevendo...",
      height: 400,
    });
  });
</script>

{% endblock %}
